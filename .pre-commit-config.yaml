repos:
  - repo: local
    hooks:
      - id: guard-real-content
        name: Block real meeting content
        entry: scripts/guard_commit.py
        language: script
      - id: ruff-check
        name: ruff check
        entry: uv run --project backend ruff check --config backend/pyproject.toml --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --project backend ruff format --check --config backend/pyproject.toml --force-exclude
        language: system
        types: [python]
      - id: frontend-lint
        name: eslint (frontend)
        entry: pnpm --dir frontend lint
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: frontend-format
        name: prettier (frontend)
        entry: pnpm --dir frontend format:check
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: frontend-typecheck
        name: tsc (frontend)
        entry: pnpm --dir frontend typecheck
        language: system
        files: ^frontend/
        pass_filenames: false
